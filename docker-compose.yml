services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # 本機測試用的 Postgres（非必要）：api 現在直接吃 .env 的 DATABASE_URL，
  # 預設連去 Supabase。如果想改回連這個本機容器，把上面 api 區塊的
  # environment.DATABASE_URL 加回來指向 db:5432 即可。
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leave_user
      POSTGRES_PASSWORD: leave_pass
      POSTGRES_DB: leave_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave_user -d leave_system"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
