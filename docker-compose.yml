services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://leave_user:leave_pass@db:5432/leave_system
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leave_user
      POSTGRES_PASSWORD: leave_pass
      POSTGRES_DB: leave_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave_user -d leave_system"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
